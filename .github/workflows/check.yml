name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # Version aus packageManager in package.json; ein zweiter Wert hier bricht den Setup-Schritt ab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Einmal täglich gegen die echten APIs. Scheitert, wenn eine Quelle ihre Form ändert.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # Version aus packageManager in package.json; ein zweiter Wert hier bricht den Setup-Schritt ab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aufzeichnungen
          path: test/live/aufzeichnungen/
